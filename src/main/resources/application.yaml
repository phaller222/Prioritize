spring:
  profiles:
      # Default is the self-contained H2 file DB so a fresh checkout runs with no external
      # setup. Use `postgres` for the shared/production database (e.g. -Dspring.profiles.active=postgres).
      active: h2

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  application:
    name: prioritize

server:
  tomcat:
    basedir: tomcat
    accesslog:
      directory: logs

logging:
  level:
    org.flowable: INFO
  #file:
    #name: logs/Prioritize.log

springdoc:
  api-docs:
    # Emit OpenAPI 3.0.1 instead of the springdoc default 3.1.0. The REST contract uses no 3.1-only
    # constructs, and 3.0.x has the widest tooling support — in particular the OpenAPI Generator behind
    # the official client libraries cannot resolve a document with a 3.1.0 header. Emitting 3.0.1 here
    # means the released docs/openapi.json is directly consumable with no per-client patching.
    version: openapi_3_0

# Application metadata. `version` is filtered from the Maven project version at build time
# (spring-boot-starter-parent filters application.yaml with @...@ delimiters) so the OpenAPI
# document's info.version tracks the release without a second place to bump. See OpenApiConfig.
prioritize:
  version: @project.version@