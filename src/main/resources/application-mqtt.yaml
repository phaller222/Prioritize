prioritize:
  mqtt:
    enabled: true
    # "memoryalpha" is the broker on the network this project is developed on — put your own broker
    # here. This whole profile is opt-in: without "mqtt" in spring.profiles.active nothing connects
    # and no subscription is made, so an unreachable host here costs a fresh checkout nothing.
    broker-url: tcp://memoryalpha:1883
    client-id: prioritize-backend
    #username: prioritize
    #password: ${MQTT_PASSWORD:}
    qos: 1
    subscribe-topics:
      - DISCOVERY          # self-registration of devices (type=DISCOVERY)
      - "+/status"         # <uuid>/status: online/offline heartbeats (type=STATUS)
      - "+/values"         # <uuid>/values: telemetry readings (type=VALUE)